[project]
name = "bq-mcp-analyst"
version = "0.1.0"
description = "BigQuery MCP server on Cloud Run and ADK agents that use it locally, via Agent Registry and on Agent Runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[a2a,agent-identity]>=2.13,<3",  # extras needed by the Agent Registry client (a2a-sdk, Auth Manager)
    "google-cloud-aiplatform[agent_engines,adk]>=2.6,<3",
    "google-genai>=2.33,<3",
    "mcp>=1.30,<2",                       # not a dependency of google-adk; needed for McpToolset
    "google-cloud-secret-manager>=2.20",  # API key of the Developer Knowledge MCP (docs_expert)
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "google-cloud-bigquery>=3",  # to import mcp_server/main.py in tests
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bq_analyst", "docs_expert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `@model_validator`:DeprecationWarning"]  # inside vertexai, not our code
